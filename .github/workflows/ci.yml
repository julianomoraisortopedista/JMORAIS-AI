name: mandatory-ci

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jmorais_test
          POSTGRES_USER: jmorais_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jmorais_test -d jmorais_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      JMORAIS_TEST_POSTGRES_URL: postgresql+psycopg://jmorais_test:ci_test_only@127.0.0.1:5432/jmorais_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install canonical dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Build distributable wheel and source archive
        run: python -m build
      - name: Lint and formatting hygiene
        run: python scripts/check_source_hygiene.py && git diff --check
      - name: Migration from empty database
        run: alembic upgrade head && alembic current
      - name: Complete deterministic and PostgreSQL suite
        run: python -m pytest -q --cov=jmoraIs --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
