name: postgresql-performance

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [SMALL, MEDIUM, LARGE]
        default: MEDIUM

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jmorais_perf
          POSTGRES_USER: jmorais_perf
          POSTGRES_PASSWORD: local_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jmorais_perf" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12.13"}
      - run: python -m pip install '.[dev]'
      - run: alembic upgrade head
        env:
          JMORAIS_TEST_POSTGRES_URL: postgresql+psycopg://jmorais_perf:local_ci_only@localhost:5432/jmorais_perf
      - name: Guard dedicated suite configuration
        run: python -c "import json; p=json.load(open('evaluation/performance/profiles.json')); assert p['profiles']['${{ inputs.profile }}']['events'] > 0"
