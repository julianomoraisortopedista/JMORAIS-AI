name: live-scientific-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live-scientific-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JMORAIS_RUN_AUTHORITATIVE_BENCHMARK: "1"
      BENCHMARK_TIMEOUT_SECONDS: "20"
      BENCHMARK_DELAY_SECONDS: "0.4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run authoritative live benchmark
        run: python scripts/run_live_benchmark.py --output artifacts/live-benchmark.json --enforce-beta-thresholds
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authoritative-live-benchmark
          path: artifacts/live-benchmark.json
          if-no-files-found: error
