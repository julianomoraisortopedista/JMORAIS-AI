[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmoraIs-ai"
dynamic = ["version"]
description = "Evidence-grounded intelligence platform for JMORAIS AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "SQLAlchemy>=2.0.0",
  "psycopg[binary]>=3.2.1",
  "fastapi>=0.141.1,<0.142",
  "PyJWT[crypto]>=2.9.0,<3",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.13.0",
  "build>=1.2.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0,<1",
  "uvicorn>=0.30.0,<1",
]

anthropic = [
  "anthropic>=1,<2",
]

documents = [
  "pypdf>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require real external services and are disabled by default",
]

[tool.setuptools.packages.find]
include = ["jmoraIs*", "evaluation*", "services*"]

[tool.setuptools.dynamic]
version = {attr = "jmoraIs.__version__"}

[tool.setuptools.package-data]
"evaluation.scientific_benchmark" = ["data/*.json"]
