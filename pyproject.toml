[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmoraIs-ai"
version = "0.1.0"
description = "Evidence-grounded intelligence platform for JMORAIS AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "SQLAlchemy>=2.0.0",
  "psycopg[binary]>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require real external services and are disabled by default",
]

[tool.setuptools]
packages = ["jmoraIs", "services.pubmed"]
