services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jmorais_test
      POSTGRES_USER: jmorais_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmorais_test -d jmorais_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  python312-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      JMORAIS_TEST_POSTGRES_URL: postgresql+psycopg://jmorais_test:local_test_only@postgres-test:5432/jmorais_test
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]
